# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: trip-planner
metadata:
  template: trip-planner@0.0.1

services:
  web:
    project: .
    language: js
    host: staticwebapp
    dist: dist

hooks:
  preprovision:
    posix:
      shell: sh
      run: echo "🚀 Starting Azure Static Web Apps provisioning..."
      interactive: false
  
  postprovision:
    posix:
      shell: sh
      run: |
        echo ""
        echo "✅ Infrastructure provisioning complete!"
        echo "📦 Static Web App: ${STATIC_WEB_APP_NAME}"
        echo "🌐 URL: ${STATIC_WEB_APP_URL}"
        echo ""
        echo "Next step: Run 'azd deploy' to deploy the application"
        echo ""
      interactive: false
      continueOnError: true
