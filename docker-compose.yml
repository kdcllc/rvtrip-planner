# Local SQL Server for development only. No Azure, no cost.
# The password comes from the environment; the default below is a development-only
# placeholder for a throwaway local container and must never be reused anywhere else.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trip-planner-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local-Dev-Only-1}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: applies migrations and the local dev seed (db/seed) once SQL Server is healthy.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local-Dev-Only-1}"
      DB_NAME: "${DB_NAME:-tripplanner}"
    volumes:
      - ./db:/db:ro
      - ./scripts/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    restart: "no"

volumes:
  sqlserver-data:
