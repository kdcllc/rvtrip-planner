name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Optional: OpenRouteService fallback routing (free tier: 2,000 req/day)
      VITE_OPENROUTE_API_KEY: ${{ secrets.VITE_OPENROUTE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install API dependencies
        run: npm ci --ignore-scripts
        working-directory: api

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: API type check and build
        run: npm run build
        working-directory: api

      - name: API tests
        run: npm test
        working-directory: api

      - name: Build
        run: npm run build

  # Applies the migrations and the local dev seed to a throwaway SQL Server, twice,
  # so a migration or seed that fails or is not re-runnable is caught before merge.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SQL Server
        run: docker compose up -d --wait sqlserver

      - name: Apply migrations and seed
        run: docker compose run --rm db-init

      - name: Apply again (must be re-runnable)
        run: docker compose run --rm db-init

      - name: Show SQL Server logs on failure
        if: failure()
        run: docker compose logs --tail 100 sqlserver
