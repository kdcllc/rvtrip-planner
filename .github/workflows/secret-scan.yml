name: Secret Scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # gitleaks v8.30.1, pinned by image digest (never a floating tag)
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit range
        id: range
        run: |
          zeros=0000000000000000000000000000000000000000
          # Fail closed: every SHA of the chosen range must exist as a commit in the clone
          require_commit() {
            if [ -z "$2" ] || ! git cat-file -e "$2^{commit}" 2>/dev/null; then
              echo "::error::$1 '$2' is not a commit in this clone; refusing to skip the secret scan"
              exit 1
            fi
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_commit "pull_request base SHA" "$PR_BASE_SHA"
            require_commit "pull_request head SHA" "$PR_HEAD_SHA"
            log_opts="$PR_BASE_SHA..$PR_HEAD_SHA"
          else
            require_commit "pushed SHA" "$PUSH_SHA"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zeros" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              log_opts="$PUSH_BEFORE..$PUSH_SHA"
            else
              # New branch, or a previous tip that is not in the clone (force push): scan the pushed commit only
              log_opts="-1 $PUSH_SHA"
            fi
          fi
          # git itself must accept the range; do not rely on gitleaks' exit code for a bad range
          # shellcheck disable=SC2086
          if ! git rev-list $log_opts >/dev/null; then
            echo "::error::git rejected the commit range '$log_opts'"
            exit 1
          fi
          echo "Scanning: git log $log_opts"
          echo "log_opts=$log_opts" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks on the commit range
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm -v "$PWD":/repo:ro "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --log-opts="$LOG_OPTS" \
            --no-banner --redact
